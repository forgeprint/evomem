name: evomem_mobile
description: 'Evomem mobile app - local-first AI-ready memory infrastructure'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: 6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 18.0.2
  http: 1.6.0
  intl: 0.20.3
  path: 1.9.1
  path_provider: 2.1.6
  record: 7.1.1
  sqflite: 2.4.2
  sqflite_common_ffi_web: 1.2.0
  # Already in the build as a transitive dependency of record_web and
  # sqflite_common_ffi_web, so declaring it adds nothing to the bundle. It is
  # here because the web build asks the browser why the microphone is not
  # available, and there is no other way to ask. Pinned exactly, like the
  # rest.
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3
  very_good_analysis: 11.0.0

flutter:
  generate: true
  uses-material-design: true