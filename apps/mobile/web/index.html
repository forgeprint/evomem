<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Evomem - Local-first AI-ready memory infrastructure">
    <title>Evomem</title>
    <link rel="icon" type="image/png" href="icons/Icon-192.png">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <script>
        // Configure loading indicator
        var loadingContainer = document.createElement('div');
        loadingContainer.id = 'loading-container';
        loadingContainer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fafafa;z-index:9999;';
        loadingContainer.innerHTML = '<div style="text-align:center;"><div style="width:48px;height:48px;border:4px solid #3f51b5;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div><div style="color:#3f51b5;font-family:system-ui;">Loading Evomem...</div></div>';
        var style = document.createElement('style');
        style.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
        document.head.appendChild(style);
        document.body.appendChild(loadingContainer);

        // Remove loading indicator when Flutter loads
        window.addEventListener('load', function() {
            var loader = document.getElementById('loading-container');
            if (loader) loader.remove();
        });
    </script>
    <script src="flutter.js" defer></script>
    <script>
        window.addEventListener('load', function(ev) {
            _flutter.loader.loadEntrypoint({
                serviceWorker: {
                    serviceWorkerVersion: serviceWorkerVersion,
                },
                onEntrypointLoaded: function(engineInitializer) {
                    engineInitializer.initializeEngine().then(function(appRunner) {
                        appRunner.runApp();
                    });
                },
            });
        });
    </script>
</body>
</html>
