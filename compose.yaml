# Evomem, running continuously: the database, the server and the web app.
#
# The web app is a browser page and talks to the server over HTTP like any
# other client, so the two are separate services on separate ports and the
# server's EVOMEM_CORS_ORIGIN is what lets the page call it at all. Nothing
# is served to a wildcard origin (ADR-0010).
#
# Secrets come from .env, which is not committed. `cp .env.example .env` and
# fill it in; the server refuses to serve an endpoint whose secret is
# missing rather than serving it open.

name: evomem

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evomem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-evomem}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Published on loopback only: this is the machine's database, not the
    # network's. Change it deliberately if something else has to reach it.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # The server waits for this rather than for the container to exist:
      # postgres accepts connections a few seconds after it starts, and a
      # migration that runs before then fails for no reason anyone can see.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evomem} -d ${POSTGRES_DB:-evomem}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        VERSION: ${EVOMEM_VERSION:-docker}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      EVOMEM_API_TOKEN: ${EVOMEM_API_TOKEN:?set EVOMEM_API_TOKEN in .env}
      EVOMEM_SECRET_KEY: ${EVOMEM_SECRET_KEY:?set EVOMEM_SECRET_KEY in .env}
      EVOMEM_PROJECT: ${EVOMEM_PROJECT:-default}
      # The origins the web service is published on, and no others. Both
      # spellings of this machine, because a browser treats localhost and
      # 127.0.0.1 as different origins and the app is reachable at either.
      EVOMEM_CORS_ORIGIN: ${EVOMEM_CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
      # Where the notes live (ADR-0028). Not EVOMEM_POSTGRES_DSN, which
      # means the mirror sync pushes to — a different database in a
      # different role, and one name for both would be a mistake nobody
      # could see.
      EVOMEM_STORE_DSN: postgres://${POSTGRES_USER:-evomem}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evomem}?sslmode=disable
      EVOMEM_TELEGRAM_SECRET: ${EVOMEM_TELEGRAM_SECRET:-}
      EVOMEM_TELEGRAM_PROJECT: ${EVOMEM_TELEGRAM_PROJECT:-}
      EVOMEM_JIRA_SECRET: ${EVOMEM_JIRA_SECRET:-}
      EVOMEM_JIRA_PROJECT: ${EVOMEM_JIRA_PROJECT:-}
      # Speech to text, on this machine (ADR-0016, ADR-0037). evomem is the
      # client; which server answers the URL is the operator's business, and
      # here it is the `whisper` service below. No token: it is not published
      # to the host and only this network can reach it.
      EVOMEM_TRANSCRIPTION_URL: ${EVOMEM_TRANSCRIPTION_URL:-http://whisper:9000}
      # Deliberately unset, because with this service it does nothing.
      #
      # evomem sends `language` with the request and hwdsl2/whisper-server
      # ignores it: the same audio comes back byte-identical with and
      # without it, while the service's own WHISPER_LANGUAGE decides
      # (measured 2026-10-12, ADR-0039). Setting it here would claim a
      # control this stack does not have. The language is set on the
      # `whisper` service below, and another implementation of the same API
      # may well honour this instead.
    volumes:
      # The recordings. The notes are in PostgreSQL now; what still belongs
      # beside the process is the audio a note stands for (ADR-0018).
      - server-data:/data
    ports:
      - "127.0.0.1:${EVOMEM_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Speech to text, local and unpaid (ADR-0037).
  #
  # faster-whisper behind an OpenAI-compatible API, which is the interface
  # evomem already speaks — "OpenAI-compatible" is the wire format, not a
  # vendor. Nothing leaves this machine and nothing is billed.
  whisper:
    image: hwdsl2/whisper-server:latest
    restart: unless-stopped
    environment:
      # No key. The image generates one on a fresh persistent install;
      # empty turns authentication off, which is what makes sense for a
      # service that is not published to the host and is reachable only
      # from this compose network.
      WHISPER_API_KEY: ""
      # `base` is the image's default and is poor at Turkish. `small` is
      # ~465 MB and markedly better; `medium` is ~1.5 GB and better again,
      # at a speed that tells on a CPU. Downloaded on first start and
      # cached in the volume.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # The language whisper decides for itself, unless somebody names one.
      #
      # `${VAR:-}` and not `${VAR:-tr}`: the image's own run.sh turns an
      # empty value into `auto` (line 100, read from the running container
      # on 2026-10-12). Set WHISPER_LANGUAGE in .env to pin it to one
      # language again.
      #
      # This reverses the part of ADR-0016 that set the language rather than
      # letting it be guessed, and ADR-0039 records why, with measurements:
      # `small` reads this project's Turkish test sentence identically
      # whether the language is given or not, and a Turkish-pinned service
      # turns English speech into Turkish nonsense.
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      # The model, so it is fetched once rather than on every start.
      - whisper-data:/var/lib/whisper
    # Deliberately no `ports`. Nothing outside this network needs it, and
    # with authentication off that is what keeps it private.

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"


volumes:
  db-data:
  server-data:
  whisper-data:
