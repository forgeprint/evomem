server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The cache headers first: nginx takes the first matching regex
	# location, and these files are the ones a new deploy has to replace.
	# Everything else Flutter builds is content-hashed.
	location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# Anything with a file extension is an asset, and a missing one says 404.
	# Without this the fallback below answers every missing file with 200 and
	# the contents of index.html — checked, and /does-not-exist.js really did
	# come back as HTML. A browser then fails to parse the page as JavaScript
	# and the access log shows a success, which is the worst of both.
	location ~ \.[^./]+$ {
		try_files $uri =404;
	}

	# The fallback, now only for paths that look like pages. The app routes on
	# the fragment (#/sources), which never reaches the server at all; this is
	# for a deep link that somehow does.
	location / {
		try_files $uri $uri/ /index.html;
	}

	gzip on;
	gzip_types text/plain text/css application/javascript application/json
		application/wasm image/svg+xml;
}
