server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The app routes on the fragment (#/sources), which never reaches the
	# server. This fallback is for a deep link that somehow does, and for
	# a reload on a path the static tree has no file for.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# The build is content-hashed by Flutter except for these, which are
	# the files a new deploy has to actually replace.
	location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json)$ {
		add_header Cache-Control "no-cache, must-revalidate";
	}

	# No `types` block here on purpose. sqflite_common_ffi_web loads
	# sqlite3.wasm and the browser refuses a wrong type (ADR-0022) — but
	# nginx's own mime.types already maps wasm, and a `types` block at this
	# level *replaces* the inherited map rather than adding to it. Declaring
	# one here would serve main.dart.js as application/octet-stream and the
	# app would not start at all.

	gzip on;
	gzip_types text/plain text/css application/javascript application/json
		application/wasm image/svg+xml;
}
